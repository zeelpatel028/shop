{% extends 'base.html' %}

{% block title %}Add Product - Holi Hub{% endblock %}

{% block extra_css %}
{{ super() }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('main_store.static', filename='css/add_product.css') }}">

{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}
<div class="add-product-container">
    <form action="{{ url_for('main_store.add_product') }}" method="POST">
        <div class="elite-dashboard-header">
            <div class="elite-header-group">
                <div class="elite-header-accent"></div>
                <div>
                    <h1 class="elite-header-title">Add <span>Product</span></h1>
                </div>
            </div>
            <div class="header-actions">
                <a href="{{ url_for('main_store.master_stock') }}" class="btn btn-secondary">
                    <i class="fas fa-rotate-left"></i> Discard
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-cloud-upload"></i> Create Product
                </button>
            </div>
        </div>

        <div class="main-grid">
            <!-- Main Column -->
            <div class="main-column">
                <!-- General Info -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-file-lines"></i> Basic Information
                    </div>
                    <div class="form-group">
                        <label class="form-label">Full Product Name</label>
                        <input type="text" name="product_name" class="form-control"
                            placeholder="Enter descriptive product name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Manufacturer / Brand</label>
                        <input type="text" name="brand" class="form-control" placeholder="e.g. Premium Brand">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Display Store</label>
                        <input type="text" name="store_name" class="form-control" value="Main Store"
                            placeholder="Store where this will be visible">
                    </div>
                </div>

                <!-- Organization & Status -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-tags"></i> Classification
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department / Category</label>
                        <input type="text" name="category" class="form-control" placeholder="Enter category name"
                            required>
                    </div>
                    <div class="pricing-grid">
                        <div class="form-group">
                            <label class="form-label">Visibility Status</label>
                            <select name="product_status" class="form-control">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                                <option value="Draft">Draft</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Stock Status Flag</label>
                            <select name="stock_status" class="form-control">
                                <option value="In Stock">In Stock</option>
                                <option value="Low Stock">Low Stock</option>
                                <option value="Out of Stock">Out of Stock</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Details Column -->
            <div class="details-column">
                <!-- Pricing -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-circle-dollar-to-slot"></i> Commercial Details
                    </div>
                    <div class="pricing-grid">
                        <div class="form-group">
                            <label class="form-label">Cost Price (₹)</label>
                            <input type="number" name="cost_price" step="0.01" class="form-control" placeholder="0.00"
                                id="cost_price">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Base Price (₹)</label>
                            <input type="number" name="base_price" step="0.01" class="form-control" placeholder="0.00"
                                id="base_price" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">GST Tax (%)</label>
                            <input type="number" name="tax_percent" step="0.01" class="form-control" placeholder="0"
                                id="tax_percent">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tax Amount (₹)</label>
                            <input type="number" name="tax_amount" step="0.01" class="form-control" placeholder="0.00"
                                id="tax_amount" readonly>
                        </div>
                    </div>
                    <div class="pricing-grid"
                        style="margin-top: 10px; padding-top: 15px; border-top: 2px dashed #f1f5f9;">
                        <div class="form-group">
                            <label class="form-label">Margin (₹)</label>
                            <input type="number" name="profit_margin" step="0.01" class="form-control"
                                placeholder="Profit" id="profit_margin" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Final Sell Price (₹)</label>
                            <input type="number" name="sell_price" step="0.01" class="form-control" placeholder="0.00"
                                id="sell_price" required>
                        </div>
                    </div>
                </div>

                <!-- Inventory -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-warehouse"></i> Warehouse Data
                    </div>
                    <div class="pricing-grid">
                        <div class="form-group">
                            <label class="form-label">Initial Stock</label>
                            <input type="number" name="stock" class="form-control" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sold Base</label>
                            <input type="number" name="sold_stock" class="form-control" placeholder="0" value="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Measurement Unit</label>
                        <select name="product_unit" class="form-control">
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="ltr">ltr</option>
                            <option value="pcs">pcs</option>
                            <option value="box">box</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Unit Description</label>
                        <input type="text" name="price_quantity" class="form-control"
                            placeholder="e.g. per 1 kg bundle">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    const costPrice = document.getElementById('cost_price');
    const basePrice = document.getElementById('base_price');
    const taxPercent = document.getElementById('tax_percent');
    const taxAmount = document.getElementById('tax_amount');
    const profitMargin = document.getElementById('profit_margin');
    const sellPrice = document.getElementById('sell_price');

    function calculateFromBase() {
        const base = parseFloat(basePrice.value) || 0;
        const taxP = parseFloat(taxPercent.value) || 0;
        const taxA = (base * taxP) / 100;
        taxAmount.value = taxA.toFixed(2);

        const total = base + taxA;
        sellPrice.value = total.toFixed(2);
        calculateProfit();
    }

    function calculateProfit() {
        const sell = parseFloat(sellPrice.value) || 0;
        const cost = parseFloat(costPrice.value) || 0;
        const profit = sell - cost;
        profitMargin.value = profit.toFixed(2);
    }

    // When base or tax changes, update Sell Price and then Profit
    [basePrice, taxPercent].forEach(el => {
        el.addEventListener('input', calculateFromBase);
    });

    // When Sell Price or Cost Price changes, update Profit Margin
    [sellPrice, costPrice].forEach(el => {
        el.addEventListener('input', calculateProfit);
    });
</script>
{% endblock %}
