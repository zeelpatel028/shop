{% extends 'holi_base.html' %}

{% block title %}Add Product - Holi Hub{% endblock %}

{% block extra_css %}
{{ super() }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('festiv_store.static', filename='css/add_product.css') }}">
{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}
<form action="{{ url_for('festiv_store.add_product') }}" method="POST" enctype="multipart/form-data">
    <div class="page-header">
        <h1 class="page-title">Add Product</h1>
        <div class="header-actions">
            <a href="{{ url_for('festiv_store.master_stock') }}" class="btn btn-secondary">Discard</a>
            <button type="submit" class="btn btn-primary">Add Product</button>
        </div>
    </div>

    <div class="main-grid">
        <!-- Left Column -->
        <div class="left-column">
            <!-- General Info -->
            <div class="card">
                <div class="card-header">General Information</div>
                <div class="form-group">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="product_name" class="form-control"
                        placeholder="e.g. Organic Holi Colors Pack" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Brand</label>
                    <input type="text" name="product_brand" class="form-control" placeholder="e.g. Festiv Brand">
                </div>
                <div class="form-group">
                    <label class="form-label">Store Name (Vendor)</label>
                    <input type="text" name="store_name" class="form-control" placeholder="e.g. Festiv Stores">
                </div>
            </div>


        </div>

        <!-- Pricing -->
        <div class="card">
            <div class="card-header">Pricing & Tax</div>
            <div class="pricing-grid">
                <div class="form-group">
                    <label class="form-label">Base Price</label>
                    <input type="number" name="base_price" step="0.01" class="form-control" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Offer Price</label>
                    <input type="number" name="offer_price" step="0.01" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">Tax Percent (%)</label>
                    <input type="number" name="tax_percent" step="0.01" class="form-control" placeholder="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Cost Price</label>
                    <input type="number" name="cost_price" step="0.01" class="form-control" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">Profit Margin</label>
                    <input type="number" name="profit_margin" step="0.01" class="form-control" placeholder="0.00">
                </div>
            </div>
        </div>
    </div>

    <!-- Right Column (Sidebar) -->
    <div class="right-column">
        <!-- Inventory -->
        <div class="card">
            <div class="card-header">Inventory</div>
            <div class="form-group">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" placeholder="0" required>
            </div>
            <div class="form-group">
                <label class="form-label">Weight</label>
                <input type="number" name="product_weight" step="0.01" class="form-control" placeholder="0.0">
            </div>
            <div class="form-group">
                <label class="form-label">Unit</label>
                <select name="product_unit" class="form-control category-select">
                    <option value="kg">kg</option>
                    <option value="g">g</option>
                    <option value="ltr">ltr</option>
                    <option value="pcs">pcs</option>
                    <option value="box">box</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Product Quantity (Pack Size)</label>
                <input type="number" name="product_quantity" class="form-control" placeholder="1">
            </div>
            <div class="form-group">
                <label class="form-label">Price Quantity (e.g. per kg)</label>
                <input type="text" name="price_quantity" class="form-control" placeholder="e.g. 1 kg">
            </div>
        </div>

        <!-- Organization -->
        <div class="card">
            <div class="card-header">Organize</div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="product_category" class="form-control category-select">
                    <option value="Colors">Colors</option>
                    <option value="Water Guns">Water Guns</option>
                    <option value="Sweets">Sweets</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Kits">Kits</option>
                    <option value="Clothing">Clothing</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select name="product_status" class="form-control category-select">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="Draft">Draft</option>
                </select>
            </div>
        </div>
    </div>
    </div>
</form>
{% endblock %}
