<aside class="sidebar holi-sidebar" id="sidebar">
    <div class="sidebar-header"
        style="background: var(--elite-black); border-bottom: 1px solid rgba(255,255,255,0.05); height: 70px; display: flex; align-items: center; padding: 0 20px;">
        <div class="logo" style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
            <div id="toggle-sidebar-alt" style="display: flex; align-items: center; cursor: pointer;">
                <div
                    style="width: 35px; height: 35px; border-radius: 10px; overflow: hidden; margin-right: 15px; box-shadow: 0 4px 12px rgba(108, 93, 211, 0.3); flex-shrink: 0; border: 1.5px solid var(--elite-purple);">
                    <img src="{{ url_for('static', filename='images/1770743257917.png') }}" alt="Logo"
                        style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <span class="brand-name"
                    style="font-size: 1.2rem; font-weight: 900; white-space: nowrap; color: var(--elite-white) !important;">Tulshi
                    Shop</span>
            </div>
            <div id="close-sidebar" onclick="toggleMobileSidebar()"
                style="cursor: pointer; color: #fff; display: none;">
                <i class="fas fa-times" style="font-size: 1.5rem;"></i>
            </div>
        </div>
    </div>

    <nav class="sidebar-nav" style="padding: 25px 0;">
        <style>
            .sidebar-nav ul li a {
                border-left: 4px solid transparent;
                margin-bottom: 8px;
                border-radius: 0 50px 50px 0;
                transition: 0.3s;
                color: rgba(255, 255, 255, 0.7) !important;
                display: flex;
                align-items: center;
                padding: 12px 25px;
                text-decoration: none;
            }

            .sidebar-nav ul li.active a,
            .sidebar-nav ul li a.active-link {
                border-left: 4px solid var(--elite-purple) !important;
                background: rgba(108, 93, 211, 0.1) !important;
                color: var(--elite-purple) !important;
                box-shadow: none !important;
                font-weight: 700;
            }

            .sidebar-nav ul li a:hover {
                background: rgba(255, 255, 255, 0.03) !important;
                color: var(--elite-white) !important;
            }

            .sidebar-nav ul li a i {
                margin-right: 15px;
                width: 20px;
                text-align: center;
                font-size: 1.1rem;
            }

            @media (max-width: 768px) {
                .sidebar.holi-sidebar {
                    left: -100% !important;
                    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                    z-index: 1050;
                    box-shadow: none;
                }

                .sidebar.holi-sidebar.mobile-open {
                    left: 0 !important;
                    box-shadow: 20px 0 50px rgba(0, 0, 0, 0.3);
                }

                #close-sidebar {
                    display: block !important;
                }
            }

            /* Collapsed Sidebar Fixes */
            .sidebar.active .brand-name {
                display: none !important;
            }

            .sidebar.active .sidebar-header {
                padding: 0 !important;
                justify-content: center !important;
            }

            .sidebar.active .logo {
                width: 100% !important;
                justify-content: center !important;
            }

            .sidebar.active .logo>div:first-child {
                justify-content: center;
            }

            .sidebar.active .logo>div:first-child>div {
                margin-right: 0 !important;
            }
        </style>
        <ul>
            <li class="{% if request.endpoint == 'festiv_store.holi_dashboard' %}active{% endif %}">
                <a href="{{ url_for('festiv_store.holi_dashboard') }}"
                    class="{% if request.endpoint == 'festiv_store.holi_dashboard' %}active-link{% endif %}">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="{% if request.endpoint == 'festiv_store.add_product' %}active{% endif %}">
                <a href="{{ url_for('festiv_store.add_product') }}"
                    class="{% if request.endpoint == 'festiv_store.add_product' %}active-link{% endif %}">
                    <i class="fas fa-plus-circle"></i>
                    <span>Add Product</span>
                </a>
            </li>
            <li class="{% if request.endpoint == 'festiv_store.master_stock' %}active{% endif %}">
                <a href="{{ url_for('festiv_store.master_stock') }}"
                    class="{% if request.endpoint == 'festiv_store.master_stock' %}active-link{% endif %}">
                    <i class="fas fa-boxes"></i>
                    <span>All Product</span>
                </a>
            </li>
            <li class="{% if request.endpoint == 'festiv_store.make_bill' %}active{% endif %}">
                <a href="{{ url_for('festiv_store.make_bill') }}"
                    class="{% if request.endpoint == 'festiv_store.make_bill' %}active-link{% endif %}">
                    <i class="fas fa-file-invoice"></i>
                    <span>Make Bill</span>
                </a>
            </li>
            <li class="{% if request.endpoint == 'festiv_store.ledger' %}active{% endif %}">
                <a href="{{ url_for('festiv_store.ledger') }}"
                    class="{% if request.endpoint == 'festiv_store.ledger' %}active-link{% endif %}">
                    <i class="fas fa-chart-line"></i>
                    <span>Revenue</span>
                </a>
            </li>
            <li class="{% if request.endpoint == 'festiv_store.payment_data' %}active{% endif %}">
                <a href="{{ url_for('festiv_store.payment_data') }}"
                    class="{% if request.endpoint == 'festiv_store.payment_data' %}active-link{% endif %}">
                    <i class="fas fa-database"></i>
                    <span>Payment Data</span>
                </a>
            </li>

            <li>
                <a href="{{ url_for('festiv_store.index') }}">
                    <i class="fas fa-store"></i>
                    <span>Public View</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('home') }}">
                    <i class="fas fa-shield-heart"></i>
                    <span>Main Core</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer" style="padding: 30px; border-top: 1px solid rgba(255,255,255,0.03);">
        <a href="{{ url_for('logout') }}" class="logout-link"
            style="display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 700; color: #ef4444 !important;">
            <i class="fas fa-power-off"></i>
            <span>TERMINATE</span>
        </a>
    </div>
</aside>
