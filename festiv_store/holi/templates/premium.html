{% extends 'holi_base.html' %}

{% block title %}Holi Premium - Coming Soon{% endblock %}

{% block extra_css %}
{{ super() }}
<style>
    body {
        font-family: 'Outfit', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #fdf2f8;
        color: #be185d;
        text-align: center;
    }

    .container {
        padding: 2rem;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    p {
        font-size: 1.2rem;
    }

    .btn {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.8rem 2rem;
        background: #db2777;
        color: white;
        border-radius: 0.5rem;
        text-decoration: none;
        transition: 0.3s;
    }

    .btn:hover {
        background: #be185d;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <h1>Holi Premium</h1>
    <p>This premium collection is coming soon!</p>
    <a href="{{ url_for('festiv_store.index') }}" class="btn">Back to Store</a>
</div>
{% endblock %}
