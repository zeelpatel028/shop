{% extends 'holi_base.html' %}

{% block title %}Ledger - Holi Hub{% endblock %}

{% block extra_css %}
{{ super() }}
<style>
    body {
        background-color: #000000 !important;
        color: #fff !important;
    }

    .main-content {
        background-color: #000000 !important;
    }

    .content-wrapper {
        background: transparent !important;
        padding: 0 !important;
    }

    .elite-card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
    }

    .bill-btn {
        background: #FFD700;
        color: #000;
        padding: 12px 25px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: 0.3s;
    }
</style>
{% endblock %}

{% block content %}
<div class="holi-dashboard" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="elite-card" style="text-align: center; max-width: 500px; padding: 60px;">
        <div style="font-size: 4rem; color: #FFD700; margin-bottom: 20px;">
            <i class="fas fa-history"></i>
        </div>
        <h1 style="color: #fff; font-size: 2.5rem; font-weight: 900; margin-bottom: 15px;">COMING SOON</h1>
        <p style="color: #888; font-size: 1.1rem; line-height: 1.6;">Transaction history and financial ledgers are being
            archived. The core treasury is temporarily locked.</p>
        <div style="margin-top: 40px;">
            <a href="{{ url_for('festiv_store.holi_dashboard') }}" class="bill-btn"
                style="display: inline-block;">Return to Hub</a>
        </div>
    </div>
</div>
{% endblock %}
