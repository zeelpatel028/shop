{% extends 'base.html' %}

{% block title %}Holi Hub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('festiv_store.static', filename='css/holi.css') }}">
{% endblock %}

{% block page_title %}{% endblock %}

{% block sidebar %}
{% include 'holi_sidemenu.html' %}
{% endblock %}

{% block navbar %}
<header class="top-navbar"
    style="background: #fff; border-bottom: 1px solid var(--elite-border); color: #000; padding: 0 20px; height: 70px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--elite-shadow);">
    <div class="brand-container" id="toggle-sidebar"
        style="display: flex; align-items: center; gap: 15px; cursor: pointer;">
        <div class="mobile-toggle" style="display: none; margin-right: 15px;">
            <i class="fas fa-bars" style="font-size: 1.5rem;"></i>
        </div>
        <div
            style="width: 40px; height: 40px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); border: 2px solid #000; flex-shrink: 0;">
            <img src="{{ url_for('static', filename='images/1770743257917.png') }}" alt="Logo"
                style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <span class="brand-name" style="color: #000; font-weight: 900; letter-spacing: -0.5px; font-size: 1.25rem;">Holi
            Festival Hub</span>
    </div>

    <style>
        @media (max-width: 768px) {
            .mobile-toggle {
                display: block !important;
            }

            .brand-name {
                font-size: 1.1rem !important;
            }
        }
    </style>
    <div id="sidebar-overlay" onclick="toggleMobileSidebar()"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1040; backdrop-filter: blur(4px);">
    </div>
</header>
{% endblock %}

{% block extra_js %}
<script>
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (sidebar && overlay) {
            sidebar.classList.toggle('mobile-open');
            overlay.style.display = sidebar.classList.contains('mobile-open') ? 'block' : 'none';
        }
    }

    // Attach toggle to the navbar brand/toggle button for mobile
    document.addEventListener('DOMContentLoaded', function () {
        const toggleBtn = document.getElementById('toggle-sidebar');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function (e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleMobileSidebar();
                }
            });
        }
    });
</script>
{% endblock %}
