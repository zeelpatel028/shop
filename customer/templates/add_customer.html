{% extends "base.html" %}

{% block title %}Add Customer - Tulshi Shop{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('customer.static', filename='css/add_customer.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}
<div class="add-customer-container">
    <form action="{{ url_for('customer.add_customer') }}" method="POST">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-user-plus accent-orange"></i> Add New Customer</h1>
            <div class="header-actions">
                <a href="{{ url_for('customer.dashboard') }}" class="btn btn-secondary">Discard</a>
                <button type="submit" class="btn btn-primary">Save Customer</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <i class="fas fa-id-card"></i> Personal Information
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter customer name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone_no" class="form-control" placeholder="Enter phone number" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label class="form-label">Address</label>
                    <textarea name="address" class="form-control" rows="3" placeholder="Enter full address"></textarea>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <i class="fas fa-wallet"></i> Credit & Billing Details
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Last Paid Amount</label>
                    <input type="number" step="0.01" name="padin_amount_last" class="form-control" value="0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">Total Paid Amount</label>
                    <input type="number" step="0.01" name="padin_amount_total" class="form-control" value="0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">Pending Bill Count</label>
                    <input type="number" name="panding_bill_count" class="form-control" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">All Bill Count</label>
                    <input type="number" name="all_bill_count" class="form-control" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-control">
                        <option value="Active">Active</option>
                        <option value="Blocked">Blocked</option>
                        <option value="VIP">VIP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Created By</label>
                    <input type="text" name="created_by" class="form-control" placeholder="Staff Name">
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
