<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulshi Shop - {% block title %}Dashboard{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        {% block sidebar %}
        {% include 'sidemenu.html' %}
        {% endblock %}

        <!-- Main Content -->
        <main class="main-content">
            {% block navbar %}
            <!-- Navbar -->
            <header class="top-navbar" style="justify-content: flex-start;">
                <div class="toggle-menu" id="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </div>

                <div class="brand-container">
                    <img src="{{ url_for('static', filename='images/1770743257917.png') }}" alt="Tulshi Shop Logo"
                        class="brand-logo">
                    <span class="brand-name">Tulshi Shop</span>
                </div>


            </header>
            {% endblock %}

            <!-- Dashboard Content -->
            <div class="content-wrapper">
                <h1 class="page-title">{% block page_title %}Dashboard Overview{% endblock %}</h1>
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
