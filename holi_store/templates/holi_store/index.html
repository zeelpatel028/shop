<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holi Store - Premium Collection</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Base Styles from Home -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <!-- Holi Store Styles -->
    <link rel="stylesheet" href="{{ url_for('holi_store.static', filename='holi_store/style.css') }}">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar (Reused) -->
        {% include 'sidemenu.html' %}

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="store-header"
                style="padding: 20px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #f0f0f0;">
                <div class="toggle-menu" id="toggle-sidebar">
                    <i class="fas fa-bars" style="font-size: 1.5rem; cursor: pointer;"></i>
                </div>
                <div class="holi-brand-wrapper">
                    <i class="fas fa-palette holi-icon"></i>
                    <h1 class="holi-store-title">Holi Store</h1>
                </div>
            </div>

            <!-- Content Area -->
            <div class="holi-content-wrapper">
                <div class="card-grid">
                    <!-- Premium Tour Card -->
                    <div class="tour-card">
                        <div class="card-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=800&q=80"
                                alt="Destination" class="card-image">
                        </div>
                        <div class="card-content">
                            <div class="card-meta">
                                <span class="badge upcoming">UPCOMING</span>
                                <span class="badge timeline">2 DAYS LEFT</span>
                                <button class="more-options"><i class="fas fa-ellipsis-h"></i></button>
                            </div>
                            <h2 class="card-title">8 Days of Cappadocia Tour</h2>

                            <div class="tour-info">
                                <div class="info-row">
                                    <i class="fas fa-plane-departure info-icon"></i>
                                    <span class="info-text">Toronto, Canada 🇨🇦</span>
                                </div>
                                <div class="info-row">
                                    <i class="fas fa-location-dot info-icon"></i>
                                    <span class="info-text">Nevsehir, Turkey 🇹🇷 <a href="#" class="more-link">+2
                                            more</a></span>
                                </div>
                            </div>

                            <div class="card-footer">
                                <img src="https://i.pravatar.cc/150?u=johannes" alt="Agent" class="user-avatar">
                                <div class="user-details">
                                    <span class="user-role">Agent</span>
                                    <span class="user-name">Johannes Doeif</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Repeated Card for Grid Consistency -->
                    <div class="tour-card">
                        <div class="card-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=800&q=80"
                                alt="Destination" class="card-image">
                        </div>
                        <div class="card-content">
                            <div class="card-meta">
                                <span class="badge upcoming">UPCOMING</span>
                                <span class="badge timeline">5 DAYS LEFT</span>
                                <button class="more-options"><i class="fas fa-ellipsis-h"></i></button>
                            </div>
                            <h2 class="card-title">Island Escape - Maldives</h2>

                            <div class="tour-info">
                                <div class="info-row">
                                    <i class="fas fa-plane-departure info-icon"></i>
                                    <span class="info-text">Mumbai, India 🇮🇳</span>
                                </div>
                                <div class="info-row">
                                    <i class="fas fa-location-dot info-icon"></i>
                                    <span class="info-text">Male, Maldives 🇲🇻</span>
                                </div>
                            </div>

                            <div class="card-footer">
                                <img src="https://i.pravatar.cc/150?u=maldives" alt="Agent" class="user-avatar">
                                <div class="user-details">
                                    <span class="user-role">Guide</span>
                                    <span class="user-name">Anita Sharma</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Reusing Home JS for sidebar toggling -->
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>

</html>
